# Dash0Monitoring for the matter-server namespace: the Matter server's container
# logs and Kubernetes events (commissioning failures, Thread/mDNS trouble, node
# subscriptions dropping). Quiet: 0 lines in the hour measured 2026-11-27, 7 in
# the last day.
#
# Workload instrumentation and Prometheus scraping are off: matter.js exposes no
# metrics endpoint.
apiVersion: operator.dash0.com/v1beta1
kind: Dash0Monitoring
metadata:
    name: matter-server
    namespace: matter-server
spec:
    instrumentWorkloads:
        mode: none
        labelSelector: dash0.com/enable!=false
    logCollection:
        enabled: true
    eventCollection:
        enabled: true
    prometheusScraping:
        enabled: false
    synchronizePersesDashboards: false
    synchronizePrometheusRules: false
