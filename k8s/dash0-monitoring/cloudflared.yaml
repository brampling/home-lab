# Dash0Monitoring for the cloudflared namespace: the tunnel connectors'
# container logs and Kubernetes events.
#
# cloudflared restarts are a network symptom: its liveness probe fails while
# every edge connection is down. Until now the
# restarts were only visible in Prometheus and the cause had to be pieced
# together from the router syslog. With this, the connectors' own "connection
# lost / registered" lines and the probe-failure and BackOff events sit in Dash0
# next to the router's logs. Quiet otherwise: 0 lines in the hour measured
# 2026-11-27.
#
# Prometheus scraping is off: the pods have no prometheus.io/* annotations.
# cloudflared does serve metrics (cloudflared_tunnel_ha_connections and others),
# so scraping them is a possible follow-up.
apiVersion: operator.dash0.com/v1beta1
kind: Dash0Monitoring
metadata:
    name: cloudflared
    namespace: cloudflared
spec:
    instrumentWorkloads:
        mode: none
        labelSelector: dash0.com/enable!=false
    logCollection:
        enabled: true
    eventCollection:
        enabled: true
    prometheusScraping:
        enabled: false
    synchronizePersesDashboards: false
    synchronizePrometheusRules: false
