# Cloudflare Tunnel connector (cloudflared) - one per cluster.
# Token-based / remotely-managed tunnel: public hostname -> service routing is
# configured in the Cloudflare Zero Trust dashboard, not here.
#
# The tunnel token is a SECRET and is NOT in this repo. Create it once:
#   kubectl -n cloudflared create secret generic cloudflared-token \
#     --from-literal=token='<YOUR_TUNNEL_TOKEN>'
#
# Deployed by Argo CD (k8s/apps/cloudflared.yaml) — commit and push, don't
# kubectl apply.
apiVersion: v1
kind: Namespace
metadata:
    name: cloudflared
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: cloudflared
    namespace: cloudflared
spec:
    replicas: 2          # HA: two connectors across nodes
    # Zero-downtime upgrades: bring one new connector up (and Ready, i.e.
    # actually connected to Cloudflare) before removing an old one.
    strategy:
        type: RollingUpdate
        rollingUpdate:
            maxUnavailable: 0
            maxSurge: 1
    selector:
        matchLabels:
            app: cloudflared
    template:
        metadata:
            labels:
                app: cloudflared
        spec:
            securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: cloudflared
                  # >= 2026.10.2 required: earlier versions trust eight
                  # compromised eMudhra (emSign) intermediates (Cloudflare
                  # advisory, 2026-10-20). 2026.10.4 also allowlists the
                  # metrics server's debug endpoints (VULN-176088).
                  image: cloudflare/cloudflared:2026.10.4
                  args:
                      - tunnel
                      - --no-autoupdate
                      - --metrics
                      - 0.0.0.0:2000
                      - run
                  env:
                      - name: TUNNEL_TOKEN
                        valueFrom:
                            secretKeyRef:
                                name: cloudflared-token
                                key: token
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                          drop:
                              - ALL
                  resources:
                      requests:
                          cpu: 50m
                          memory: 64Mi
                      limits:
                          cpu: 200m
                          memory: 128Mi
                  # /ready returns 200 only once connected to Cloudflare, so a
                  # new pod isn't counted Ready (and an old one isn't removed)
                  # until it is actually serving the tunnel.
                  readinessProbe:
                      httpGet:
                          path: /ready
                          port: 2000
                      periodSeconds: 5
                  livenessProbe:
                      httpGet:
                          path: /ready
                          port: 2000
                      initialDelaySeconds: 10
                      periodSeconds: 10
