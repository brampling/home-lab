# ArgoCD Application: OpenTelemetry Collector — the cluster's INGEST POINT for
# telemetry from outside the cluster, on a fixed LAN IP.
#
#   192.168.50.24  514/udp   syslog (Asus router: Administration > System Log >
#                            Remote Log Server). Many Asus firmwares always send
#                            to 514, so the Service maps 514 -> container 5514;
#                            5514 is unprivileged, so no extra capabilities.
#   192.168.50.24  4317/4318 OTLP gRPC/HTTP, for any other LAN sender.
#
# It also PULLS: the Fronius inverter's Solar API, every 15 s, through
# json_exporter (k8s/fronius-exporter) — the API is plain JSON, which no
# receiver reads. Those metrics go to Dash0 (direct) and, over remote write,
# to the cluster Prometheus (k8s/apps/prometheus.yaml).
#
# Fan-out: every log goes to BOTH Dash0 and the local VictoriaLogs, via separate
# exporters, so one being down doesn't block the other.
#   - Dash0: DIRECT to the ingress with its own token (secret below), NOT via the
#     operator's collector — see the exporter comments for why that matters.
#   - VictoriaLogs: native OTLP log ingest (k8s/apps/victoria-logs.yaml).
#
# Two pipelines on purpose: logs/syslog sets per-sender identity (the AiMesh's
# three boxes aggregate into one service.name with host.name for drill-down; any
# other sender defaults to its own hostname), while the plain logs pipeline passes
# OTLP senders through untouched — they set their own service.name.
#
# Stateless, so prune is safe and failover needs no volume. No hostNetwork: this
# one gets its traffic through the LoadBalancer, so the namespace stays on the
# cluster's default baseline PSA.
#
# NOTE on source IPs: Cilium L2 forces externalTrafficPolicy Cluster (see the
# Local limitation), so the collector sees a node IP, not the sender's. Senders
# are identified by the syslog hostname field / their own resource attributes.
#
# Component names follow collector 0.161.0, which renamed otlp -> otlp_grpc and
# otlphttp -> otlp_http. The chart still auto-rewrites the old names but warns;
# don't revert to them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    name: otel-collector
    namespace: argocd
spec:
    project: default
    source:
        repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
        chart: opentelemetry-collector
        targetRevision: 0.175.0
        helm:
            # A YAML STRING, not valuesObject: ArgoCD drops null-valued keys when
            # it serialises valuesObject, so `jaeger: null` never reaches Helm and
            # the chart's default receivers/pipelines survive. Nulls only work here.
            values: |
                mode: deployment
                replicaCount: 1
                # contrib build: the syslog receiver is not in the core image.
                image:
                  repository: otel/opentelemetry-collector-contrib
                service:
                  type: LoadBalancer
                  annotations:
                    lbipam.cilium.io/ips: "192.168.50.24"
                ports:
                  otlp:
                    enabled: true
                  otlp-http:
                    enabled: true
                  # Not used — don't expose them on the LAN IP.
                  jaeger-compact:
                    enabled: false
                  jaeger-thrift:
                    enabled: false
                  jaeger-grpc:
                    enabled: false
                  zipkin:
                    enabled: false
                  syslog:
                    enabled: true
                    containerPort: 5514
                    servicePort: 514
                    protocol: UDP
                resources:
                  requests:
                    cpu: 100m
                    memory: 192Mi
                  limits:
                    memory: 512Mi
                # Dash0 ingest token for the DIRECT exporter below. Created by
                # hand, never in git:
                #   kubectl -n otel-collector create secret generic \
                #     dash0-authorization-secret --from-literal=token='<TOKEN>'
                # (Dash0 token name: picluster-external-ingest.)
                extraEnvs:
                  - name: DASH0_AUTH_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: dash0-authorization-secret
                        key: token
                # Evict from a dead node after 60s instead of the default 300s.
                tolerations:
                  - key: node.kubernetes.io/not-ready
                    operator: Exists
                    effect: NoExecute
                    tolerationSeconds: 60
                  - key: node.kubernetes.io/unreachable
                    operator: Exists
                    effect: NoExecute
                    tolerationSeconds: 60
                config:
                  receivers:
                    # Chart defaults we don't want listening at all.
                    jaeger: null
                    zipkin: null
                    syslog:
                      udp:
                        listen_address: 0.0.0.0:5514
                      # Asus/BSD-style syslog. location sets the timezone for
                      # rfc3164 timestamps, which carry no offset.
                      protocol: rfc3164
                      location: Europe/Berlin
                      allow_skip_pri_header: true
                    # The Fronius inverter's Solar API through json_exporter:
                    # one job per endpoint, each naming its module and passing
                    # the endpoint URL as ?target=. 15 s is plenty for a house
                    # and light on the inverter, which Home Assistant polls too.
                    prometheus/fronius:
                      config:
                        global:
                          scrape_interval: 15s
                          scrape_timeout: 10s
                        scrape_configs:
                          - job_name: powerflow
                            metrics_path: /probe
                            params:
                              module: [powerflow]
                              target: ["http://192.168.50.5/solar_api/v1/GetPowerFlowRealtimeData.fcgi"]
                            static_configs:
                              - targets: ["fronius-exporter.otel-collector.svc.cluster.local:7979"]
                          - job_name: inverter
                            metrics_path: /probe
                            params:
                              module: [inverter]
                              target: ["http://192.168.50.5/solar_api/v1/GetInverterRealtimeData.cgi?Scope=Device&DeviceId=1&DataCollection=CommonInverterData"]
                            static_configs:
                              - targets: ["fronius-exporter.otel-collector.svc.cluster.local:7979"]
                          - job_name: inverter_3p
                            metrics_path: /probe
                            params:
                              module: [inverter_3p]
                              target: ["http://192.168.50.5/solar_api/v1/GetInverterRealtimeData.cgi?Scope=Device&DeviceId=1&DataCollection=3PInverterData"]
                            static_configs:
                              - targets: ["fronius-exporter.otel-collector.svc.cluster.local:7979"]
                          - job_name: meter
                            metrics_path: /probe
                            params:
                              module: [meter]
                              target: ["http://192.168.50.5/solar_api/v1/GetMeterRealtimeData.cgi?Scope=System"]
                            static_configs:
                              - targets: ["fronius-exporter.otel-collector.svc.cluster.local:7979"]
                          - job_name: storage
                            metrics_path: /probe
                            params:
                              module: [storage]
                              target: ["http://192.168.50.5/solar_api/v1/GetStorageRealtimeData.cgi?Scope=System"]
                            static_configs:
                              - targets: ["fronius-exporter.otel-collector.svc.cluster.local:7979"]
                  processors:
                    # Fallbacks for anything arriving on the syslog port; the
                    # transform below sets the real identity per sender.
                    resource/syslog:
                      attributes:
                        - key: service.name
                          value: syslog-unknown
                          action: upsert
                        - key: service.namespace
                          value: network
                          action: upsert
                    transform/syslog:
                      error_mode: ignore
                      log_statements:
                        # context must be stated: it can't be inferred from
                        # statements touching both log and resource.
                        - context: log
                          statements:
                            # Per semconv: host.name says WHICH box, and
                            # service.instance.id distinguishes instances of one
                            # service. Both belong on the resource, not the record.
                            - set(resource.attributes["host.name"], attributes["hostname"]) where attributes["hostname"] != nil
                            - set(resource.attributes["service.instance.id"], attributes["hostname"]) where attributes["hostname"] != nil
                            # Default for an unknown sender: its own hostname
                            # becomes its service, so a switch or NAS added later
                            # is never folded into the mesh below.
                            - set(resource.attributes["service.name"], attributes["hostname"]) where attributes["hostname"] != nil
                            # The AiMesh is ONE logical service across three boxes,
                            # so mesh-wide views are the default and host.name is
                            # the drill-down. Roles verified 2026-10-02 on the
                            # primary (sw_mode=1, re_mode=0) and its cfg_device_list
                            # — NOT parsed from the undocumented -C/-R suffix, so an
                            # unlisted or renamed device shows up with no role
                            # instead of being silently mislabelled.
                            - set(resource.attributes["service.name"], "asus-mesh") where attributes["hostname"] == "RT-AX88U_Pro-0C08-DE9AE31-C" or attributes["hostname"] == "RT-AX88U-1C10-DE9AE31-R" or attributes["hostname"] == "RT-AC88U-7200-DE9AE31-R"
                            - set(resource.attributes["asus.aimesh.role"], "primary") where attributes["hostname"] == "RT-AX88U_Pro-0C08-DE9AE31-C"
                            - set(resource.attributes["asus.aimesh.role"], "node") where attributes["hostname"] == "RT-AX88U-1C10-DE9AE31-R" or attributes["hostname"] == "RT-AC88U-7200-DE9AE31-R"
                            # host.id (the MAC, from the same verified mapping)
                            # anchors resource identity above the service triplet,
                            # so identity survives renaming service.name later —
                            # and it makes Dash0 type these as hosts without
                            # hand-setting dash0.resource.type.
                            - set(resource.attributes["host.id"], "e8:9c:25:84:0c:08") where attributes["hostname"] == "RT-AX88U_Pro-0C08-DE9AE31-C"
                            - set(resource.attributes["host.id"], "f0:2f:74:c8:1c:10") where attributes["hostname"] == "RT-AX88U-1C10-DE9AE31-R"
                            - set(resource.attributes["host.id"], "4c:ed:fb:9e:72:00") where attributes["hostname"] == "RT-AC88U-7200-DE9AE31-R"
                            # The receiver leaves the whole raw line as the body
                            # ("<13>Oct 2 ... kernel: ...") while also parsing it
                            # into attributes, so backends show the prefix twice.
                            # Promote the parsed message, drop the duplicates
                            # (hostname last — the statements above read it).
                            - set(body, attributes["message"]) where attributes["message"] != nil
                            - delete_key(attributes, "message")
                            - delete_key(attributes, "hostname")
                    # json_exporter can't turn the API's separate per-phase and
                    # per-string keys into labels, so merge them here: each
                    # named group becomes a label, e.g.
                    # fronius_meter_phase_voltage_volts_l2 ->
                    # fronius_meter_phase_voltage_volts{phase="2"}.
                    # $$ is a literal $ (a bare $ is env-var syntax here).
                    # aggregation_type is required but never applies: every
                    # merged point gets its own label value. max, not sum, so
                    # it couldn't double a voltage if it ever did.
                    metrics_transform/fronius:
                      transforms:
                        - {include: '^fronius_inverter_dc_voltage_volts_mppt(?P<mppt>[12])$$', match_type: regexp, action: combine, aggregation_type: max, new_name: fronius_inverter_dc_voltage_volts}
                        - {include: '^fronius_inverter_dc_current_amperes_mppt(?P<mppt>[12])$$', match_type: regexp, action: combine, aggregation_type: max, new_name: fronius_inverter_dc_current_amperes}
                        - {include: '^fronius_inverter_ac_phase_current_amperes_l(?P<phase>[123])$$', match_type: regexp, action: combine, aggregation_type: max, new_name: fronius_inverter_ac_phase_current_amperes}
                        - {include: '^fronius_inverter_ac_phase_voltage_volts_l(?P<phase>[123])$$', match_type: regexp, action: combine, aggregation_type: max, new_name: fronius_inverter_ac_phase_voltage_volts}
                        - {include: '^fronius_meter_phase_power_watts_l(?P<phase>[123])$$', match_type: regexp, action: combine, aggregation_type: max, new_name: fronius_meter_phase_power_watts}
                        - {include: '^fronius_meter_phase_reactive_power_var_l(?P<phase>[123])$$', match_type: regexp, action: combine, aggregation_type: max, new_name: fronius_meter_phase_reactive_power_var}
                        - {include: '^fronius_meter_phase_apparent_power_voltamperes_l(?P<phase>[123])$$', match_type: regexp, action: combine, aggregation_type: max, new_name: fronius_meter_phase_apparent_power_voltamperes}
                        - {include: '^fronius_meter_phase_current_amperes_l(?P<phase>[123])$$', match_type: regexp, action: combine, aggregation_type: max, new_name: fronius_meter_phase_current_amperes}
                        - {include: '^fronius_meter_phase_power_factor_l(?P<phase>[123])$$', match_type: regexp, action: combine, aggregation_type: max, new_name: fronius_meter_phase_power_factor}
                        - {include: '^fronius_meter_phase_voltage_volts_l(?P<phase>[123])$$', match_type: regexp, action: combine, aggregation_type: max, new_name: fronius_meter_phase_voltage_volts}
                        - {include: '^fronius_meter_line_voltage_volts_l(?P<phases>12|23|31)$$', match_type: regexp, action: combine, aggregation_type: max, new_name: fronius_meter_line_voltage_volts}
                    # The five scrape jobs become ONE resource (next processor),
                    # so their per-job health series (up, scrape_*) would
                    # collide. Keep the endpoint as a label on just those,
                    # before the job name (service.name) is overwritten.
                    transform/fronius:
                      error_mode: ignore
                      metric_statements:
                        - set(datapoint.attributes["fronius.api"], resource.attributes["service.name"]) where metric.name == "up" or IsMatch(metric.name, "^scrape_")
                    # The device's identity, not the exporter's: same shape as
                    # the routers (host.id = MAC, above the service triplet).
                    # The scrape target's address would name json_exporter, so
                    # it goes.
                    resource/fronius:
                      attributes:
                        - key: service.namespace
                          value: energy
                          action: upsert
                        - key: service.name
                          value: fronius-inverter
                          action: upsert
                        - key: service.instance.id
                          value: fronius-symo-gen24
                          action: upsert
                        - key: host.id
                          value: "00:03:ac:55:74:96"
                          action: upsert
                        - key: host.name
                          value: fronius-symo-gen24
                          action: upsert
                        - key: device.manufacturer
                          value: Fronius
                          action: upsert
                        - key: device.model.name
                          value: Symo GEN24 10.0
                          action: upsert
                        - key: server.address
                          action: delete
                        - key: server.port
                          action: delete
                        - key: url.scheme
                          action: delete
                  exporters:
                    # DIRECT to Dash0, for telemetry from OUTSIDE the cluster.
                    # The operator's collector runs k8s_attributes whose pod
                    # association ends in `from: connection`, so anything merely
                    # passing through this pod gets stamped with THIS pod's
                    # k8s.pod.* — making every router coalesce onto the collector
                    # pod's resource (equality keys on k8s.pod.uid, far above
                    # host.id). There is no way to opt out of that enrichment, so
                    # external telemetry bypasses the operator entirely.
                    otlp_grpc/dash0-direct:
                      endpoint: ingress.europe-west4.gcp.dash0.com:4317
                      headers:
                        Authorization: Bearer ${env:DASH0_AUTH_TOKEN}
                    # Via the operator's collector (holds its own token) — only
                    # for OUR OWN telemetry, where this pod's k8s identity is
                    # the correct identity.
                    otlp_grpc/dash0-operator:
                      endpoint: dash0-operator-opentelemetry-collector-service.dash0-system.svc.cluster.local:4317
                      tls:
                        insecure: true
                    otlp_http/victoria-logs:
                      logs_endpoint: http://victoria-logs-server.victoria-logs.svc.cluster.local:9428/insert/opentelemetry/v1/logs
                    # The cluster Prometheus, as a local copy for PromQL (its
                    # remote-write receiver is on in k8s/apps/prometheus.yaml).
                    prometheus_remote_write/prometheus:
                      http:
                        endpoint: http://prometheus-server.monitoring.svc.cluster.local/api/v1/write
                      # The names already carry their unit and _total.
                      translation_strategy: UnderscoreEscapingWithoutSuffixes
                      # target_info would repeat once per scrape job (they
                      # share one resource) and collide; otel_scope_* labels
                      # would fork every series on each collector upgrade.
                      target_info:
                        enabled: false
                      disable_scope_info: true
                      # Prometheus rejects out-of-order samples, so one request
                      # at a time. The volume is tiny.
                      max_batch_request_parallelism: 1
                      remote_write_queue:
                        num_consumers: 1
                  service:
                    pipelines:
                      # Nothing sends traces here yet.
                      traces: null
                      # Pipelines are split by ORIGIN, not by signal: anything
                      # ingested from the LAN goes direct (it isn't Kubernetes
                      # telemetry and must not inherit this pod's identity),
                      # while our own telemetry goes via the operator.
                      logs/syslog:
                        receivers: [syslog]
                        processors: [memory_limiter, resource/syslog, transform/syslog, batch]
                        exporters: [otlp_grpc/dash0-direct, otlp_http/victoria-logs]
                      logs:
                        receivers: [otlp]
                        processors: [memory_limiter, batch]
                        exporters: [otlp_grpc/dash0-direct, otlp_http/victoria-logs]
                      # External OTLP metrics pushed by LAN senders (none yet).
                      metrics/external:
                        receivers: [otlp]
                        processors: [memory_limiter, batch]
                        exporters: [otlp_grpc/dash0-direct]
                      # The Fronius inverter, scraped through json_exporter.
                      # Device telemetry from outside the cluster, so Dash0
                      # DIRECT like the routers — plus the Prometheus copy.
                      metrics/fronius:
                        receivers: [prometheus/fronius]
                        processors: [memory_limiter, metrics_transform/fronius, transform/fronius, resource/fronius, batch]
                        exporters: [otlp_grpc/dash0-direct, prometheus_remote_write/prometheus]
                      # Our own throughput counters (accepted vs refused/dropped).
                      # These really are about this pod, so the operator's k8s
                      # enrichment is correct here — and the namespace now has a
                      # Dash0Monitoring, without which the operator's
                      # only_monitored_namespaces filter silently drops them.
                      metrics:
                        receivers: [prometheus]
                        processors: [memory_limiter, batch]
                        exporters: [otlp_grpc/dash0-operator]
    destination:
        server: https://kubernetes.default.svc
        namespace: otel-collector
    syncPolicy:
        automated:
            # Stateless — safe to prune.
            prune: true
            selfHeal: true
        syncOptions:
            - CreateNamespace=true
