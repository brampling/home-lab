# ArgoCD Application: OpenTelemetry Collector — the cluster's INGEST POINT for
# telemetry from outside the cluster, on a fixed LAN IP.
#
#   192.168.50.24  514/udp   syslog (Asus router: Administration > System Log >
#                            Remote Log Server). Many Asus firmwares always send
#                            to 514, so the Service maps 514 -> container 5514;
#                            5514 is unprivileged, so no extra capabilities.
#   192.168.50.24  4317/4318 OTLP gRPC/HTTP, for any other LAN sender (the
#                            Fronius inverter work will land here).
#
# Fan-out: every log goes to BOTH Dash0 and the local VictoriaLogs, via separate
# exporters, so one being down doesn't block the other.
#   - Dash0: exports to the operator's existing in-cluster collector, which
#     already holds the Dash0 token — no second credential to manage.
#   - VictoriaLogs: native OTLP log ingest (k8s/apps/victoria-logs.yaml).
#
# Two pipelines on purpose: logs/syslog derives each sender's service.name from
# its own syslog hostname (so several devices can share port 514 without being
# conflated), while the plain logs pipeline passes OTLP senders through untouched
# — they set their own service.name.
#
# Stateless, so prune is safe and failover needs no volume. No hostNetwork: this
# one gets its traffic through the LoadBalancer, so the namespace stays on the
# cluster's default baseline PSA.
#
# NOTE on source IPs: Cilium L2 forces externalTrafficPolicy Cluster (see the
# Local limitation), so the collector sees a node IP, not the sender's. Senders
# are identified by the syslog hostname field / their own resource attributes.
#
# Component names follow collector 0.161.0, which renamed otlp -> otlp_grpc and
# otlphttp -> otlp_http. The chart still auto-rewrites the old names but warns;
# don't revert to them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    name: otel-collector
    namespace: argocd
spec:
    project: default
    source:
        repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
        chart: opentelemetry-collector
        targetRevision: 0.175.0
        helm:
            # A YAML STRING, not valuesObject: ArgoCD drops null-valued keys when
            # it serialises valuesObject, so `jaeger: null` never reaches Helm and
            # the chart's default receivers/pipelines survive. Nulls only work here.
            values: |
                mode: deployment
                replicaCount: 1
                # contrib build: the syslog receiver is not in the core image.
                image:
                  repository: otel/opentelemetry-collector-contrib
                service:
                  type: LoadBalancer
                  annotations:
                    lbipam.cilium.io/ips: "192.168.50.24"
                ports:
                  otlp:
                    enabled: true
                  otlp-http:
                    enabled: true
                  # Not used — don't expose them on the LAN IP.
                  jaeger-compact:
                    enabled: false
                  jaeger-thrift:
                    enabled: false
                  jaeger-grpc:
                    enabled: false
                  zipkin:
                    enabled: false
                  syslog:
                    enabled: true
                    containerPort: 5514
                    servicePort: 514
                    protocol: UDP
                resources:
                  requests:
                    cpu: 100m
                    memory: 192Mi
                  limits:
                    memory: 512Mi
                # Evict from a dead node after 60s instead of the default 300s.
                tolerations:
                  - key: node.kubernetes.io/not-ready
                    operator: Exists
                    effect: NoExecute
                    tolerationSeconds: 60
                  - key: node.kubernetes.io/unreachable
                    operator: Exists
                    effect: NoExecute
                    tolerationSeconds: 60
                config:
                  receivers:
                    # Chart defaults we don't want listening at all.
                    jaeger: null
                    zipkin: null
                    syslog:
                      udp:
                        listen_address: 0.0.0.0:5514
                      # Asus/BSD-style syslog. location sets the timezone for
                      # rfc3164 timestamps, which carry no offset.
                      protocol: rfc3164
                      location: Europe/Berlin
                      allow_skip_pri_header: true
                  processors:
                    # Fallbacks for anything arriving on the syslog port.
                    # service.name is only a placeholder: the transform below
                    # replaces it with the sender's own hostname, so a second
                    # sender (switch, NAS, AP) is never mislabelled as the router.
                    resource/syslog:
                      attributes:
                        - key: service.name
                          value: syslog-unknown
                          action: upsert
                        - key: service.namespace
                          value: network
                          action: upsert
                    transform/syslog:
                      error_mode: ignore
                      log_statements:
                        # context must be stated: it can't be inferred from
                        # statements touching both log and resource.
                        - context: log
                          statements:
                            # Each device identifies itself by its syslog
                            # hostname; that becomes its service.name.
                            - set(resource.attributes["service.name"], attributes["hostname"]) where attributes["hostname"] != nil
                            # The receiver leaves the whole raw line as the body
                            # ("<13>Oct 2 ... kernel: ...") while also parsing it
                            # into attributes, so backends show the prefix twice.
                            # Promote the parsed message, drop the duplicate.
                            - set(body, attributes["message"]) where attributes["message"] != nil
                            - delete_key(attributes, "message")
                  exporters:
                    otlp_grpc/dash0:
                      endpoint: dash0-operator-opentelemetry-collector-service.dash0-system.svc.cluster.local:4317
                      tls:
                        insecure: true
                    otlp_http/victoria-logs:
                      logs_endpoint: http://victoria-logs-server.victoria-logs.svc.cluster.local:9428/insert/opentelemetry/v1/logs
                  service:
                    pipelines:
                      # Nothing sends traces here yet.
                      traces: null
                      logs:
                        receivers: [otlp]
                        processors: [memory_limiter, batch]
                        exporters: [otlp_grpc/dash0, otlp_http/victoria-logs]
                      logs/syslog:
                        receivers: [syslog]
                        processors: [memory_limiter, resource/syslog, transform/syslog, batch]
                        exporters: [otlp_grpc/dash0, otlp_http/victoria-logs]
                      # Keeps the collector's own throughput metrics (accepted vs
                      # refused/dropped records) visible in Dash0.
                      metrics:
                        receivers: [otlp, prometheus]
                        processors: [memory_limiter, batch]
                        exporters: [otlp_grpc/dash0]
    destination:
        server: https://kubernetes.default.svc
        namespace: otel-collector
    syncPolicy:
        automated:
            # Stateless — safe to prune.
            prune: true
            selfHeal: true
        syncOptions:
            - CreateNamespace=true
