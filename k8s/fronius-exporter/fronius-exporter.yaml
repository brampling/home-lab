# json_exporter for the Fronius Symo GEN24 10.0 inverter (192.168.50.5).
# Synced by Argo CD (k8s/apps/fronius-exporter.yaml).
#
# The Solar API speaks plain JSON, which the OTel collector can't read, so this
# turns it into Prometheus metrics on demand: the collector calls
#   /probe?module=<module>&target=<Solar API URL>
# every 15 s for each endpoint (k8s/apps/otel-collector.yaml, pipeline
# metrics/fronius) and fans out to Dash0 and the cluster Prometheus. Modules
# and metric names are in config.yml.
#
# Read-only and unauthenticated: the Solar API needs no login and this only
# issues GETs. Stateless, so prune is safe and failover needs no volume.
#
# Lives in the otel-collector namespace: it's part of the ingest path, and that
# namespace's Dash0Monitoring collects its logs. Deliberately NO
# prometheus.io/scrape annotation — the Dash0 operator would scrape it too, and
# stamp the inverter's metrics with this pod's identity.
apiVersion: apps/v1
kind: Deployment
metadata:
    name: fronius-exporter
    namespace: otel-collector
spec:
    replicas: 1
    selector:
        matchLabels:
            app: fronius-exporter
    template:
        metadata:
            labels:
                app: fronius-exporter
        spec:
            securityContext:
                runAsNonRoot: true
                runAsUser: 65534
                runAsGroup: 65534
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: json-exporter
                  image: quay.io/prometheuscommunity/json-exporter:v0.8.0
                  args:
                      - --config.file=/config/config.yml
                  ports:
                      - name: http
                        containerPort: 7979
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                          drop: ["ALL"]
                  resources:
                      requests:
                          cpu: 10m
                          memory: 32Mi
                      limits:
                          memory: 64Mi
                  readinessProbe:
                      httpGet:
                          path: /metrics
                          port: http
                  livenessProbe:
                      httpGet:
                          path: /metrics
                          port: http
                      periodSeconds: 30
                  volumeMounts:
                      - name: config
                        mountPath: /config
                        readOnly: true
            volumes:
                # Name gets a content hash from kustomization.yaml's
                # configMapGenerator, so a config change rolls the pod.
                - name: config
                  configMap:
                      name: fronius-exporter-config
            # Evict from a dead node after 60s instead of the default 300s.
            tolerations:
                - key: node.kubernetes.io/not-ready
                  operator: Exists
                  effect: NoExecute
                  tolerationSeconds: 60
                - key: node.kubernetes.io/unreachable
                  operator: Exists
                  effect: NoExecute
                  tolerationSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
    name: fronius-exporter
    namespace: otel-collector
spec:
    selector:
        app: fronius-exporter
    ports:
        - name: http
          port: 7979
          targetPort: http
